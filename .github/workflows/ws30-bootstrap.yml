name: WS30 isolated branch materialization

on:
  push:
    branches:
      - ws30/minimal-intake-update-20260913

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws30/minimal-intake-update-20260913
          fetch-depth: 0
      - name: Materialize approved minimal change set
        shell: bash
        run: |
          set -euo pipefail
          cat .ws30-payload/chunk* | base64 -d > /tmp/ws30-payload.tar.xz
          xz -dc /tmp/ws30-payload.tar.xz | tar -xf -
          python -m py_compile backend/app.py backend/tests/test_conversion_tracking.py backend/tests/test_mp_lead_notification_email.py backend/tests/test_mp_minimal_intake.py
          python - <<'PY'
          import re, pathlib, subprocess
          for page in ('protect_mortgage.html', 'mortgage_thank_you.html'):
              text = pathlib.Path(page).read_text(encoding='utf-8')
              for i, script in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S)):
                  if not script.strip():
                      continue
                  p = pathlib.Path('/tmp') / f'{page}.{i}.js'
                  p.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(p)], check=True)
          PY
      - name: Commit isolated branch changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app.py protect_mortgage.html mortgage_thank_you.html backend/tests/test_conversion_tracking.py backend/tests/test_mp_lead_notification_email.py backend/tests/test_mp_minimal_intake.py
          if git diff --cached --quiet; then
            echo "No materialized changes to commit"
            exit 0
          fi
          git commit -m "WS30: minimal Mortgage Protection intake update [skip ci]"
          git push origin HEAD:ws30/minimal-intake-update-20260913
