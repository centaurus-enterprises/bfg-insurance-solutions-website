name: Backend tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bfg_test
          POSTGRES_PASSWORD: bfg_test
          POSTGRES_DB: bfg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bfg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: bfg_test
      DB_USER: bfg_test
      DB_PASSWORD: bfg_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        run: pytest tests -v
