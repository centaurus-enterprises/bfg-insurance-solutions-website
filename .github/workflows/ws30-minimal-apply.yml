name: WS30 minimal intake apply

on:
  push:
    branches:
      - ws30/minimal-intake-update-20260913
    paths:
      - '.github/workflows/ws30-minimal-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct reviewed source payloads
        shell: bash
        run: |
          set -euo pipefail
          reconstruct() {
            pattern="$1"
            output="$2"
            cat $pattern | base64 -d | gzip -d > "$output"
          }
          reconstruct '.ws30-tmp/app.py.part*' 'backend/app.py'
          reconstruct '.ws30-tmp/protect_mortgage.html.part*' 'protect_mortgage.html'
          reconstruct '.ws30-tmp/mortgage_thank_you.html.part*' 'mortgage_thank_you.html'
          reconstruct '.ws30-tmp/test_conversion_tracking.py.part*' 'backend/tests/test_conversion_tracking.py'
          reconstruct '.ws30-tmp/test_mp_lead_notification_email.py.part*' 'backend/tests/test_mp_lead_notification_email.py'
          reconstruct '.ws30-tmp/test_mp_minimal_intake.py.part*' 'backend/tests/test_mp_minimal_intake.py'
          python -m py_compile backend/app.py
      - name: Remove transient staging material
        shell: bash
        run: |
          rm -rf .ws30-tmp
          rm -f .github/workflows/ws30-minimal-apply.yml
      - name: Commit minimal implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JBizzle619'
          git config user.email '317445221+JBizzle619@users.noreply.github.com'
          git add backend/app.py protect_mortgage.html mortgage_thank_you.html \
            backend/tests/test_conversion_tracking.py \
            backend/tests/test_mp_lead_notification_email.py \
            backend/tests/test_mp_minimal_intake.py \
            .ws30-tmp .github/workflows/ws30-minimal-apply.yml
          git commit -m 'WS30: minimal mortgage protection intake update'
          git push origin HEAD:ws30/minimal-intake-update-20260913
