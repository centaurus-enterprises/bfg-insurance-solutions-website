<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mortgage Protection CRM | BFG Insurance Solutions</title><style>body{font-family:Arial,sans-serif;background:#111;color:#eee;margin:0}.top{padding:16px 22px;border-bottom:1px solid #333;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:18px}.panel{background:#1b1b1b;border:1px solid #333;border-radius:10px;padding:16px}.lead{display:block;width:100%;text-align:left;background:#222;color:#eee;border:1px solid #333;border-radius:7px;padding:10px;margin:8px 0;cursor:pointer}.lead:hover{border-color:#9b633f}.detail{display:grid;grid-template-columns:180px 1fr;gap:8px 14px}.k{color:#999}.v{word-break:break-word}.hold{color:#f5b942;font-weight:700}.danger{color:#ef7770;font-weight:700}@media(max-width:800px){.grid{grid-template-columns:1fr}.detail{grid-template-columns:1fr}}</style></head><body><div class="top"><strong>BFG Insurance Solutions — Mortgage Protection CRM</strong><a href="/logout" style="color:#ddd">Sign out</a></div><main class="wrap"><div class="grid"><section class="panel"><h2>Mortgage Protection Leads</h2><div id="list">Loading…</div></section><section class="panel"><h2>Secure Lead Record</h2><div id="detail">Select a lead.</div></section></div></main><script>const list=document.getElementById('list'),detail=document.getElementById('detail');function text(tag,value,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=value??'—';return e}function pair(parent,k,v,cls){parent.append(text('div',k,'k'));parent.append(text('div',v,'v '+(cls||'')))}async function one(id){detail.replaceChildren(text('div','Loading…'));try{const r=await fetch('/api/mp/leads/'+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw new Error(d.message||'Unable to load');const x=d.lead,b=document.createElement('div');b.className='detail';pair(b,'Name',(x.first_name||'')+' '+(x.last_name||''));pair(b,'Phone',x.phone);pair(b,'Email',x.email);pair(b,'ZIP / State',(x.zip||'')+' / '+(x.state||''));pair(b,'Age / Gender',(x.age||'')+' / '+(x.gender||''));pair(b,'Tobacco Use',x.tobacco_use===true?'Yes':'No');pair(b,'Mortgage Balance',x.mortgage_balance);pair(b,'Code Word',x.code_word);pair(b,'Intake Status',x.intake_status,x.intake_status==='INTAKE_ACCEPTED'?'':'hold');pair(b,'Evidence Status',x.evidence_status,x.evidence_status==='COMPLETE'?'':'hold');pair(b,'Screening Status',x.screening_status,'hold');pair(b,'Contact Status',x.contact_status,x.contact_status==='CLEARED_TO_CONTACT'?'':'danger');pair(b,'Notification',x.notification_status);pair(b,'Consent Version',x.consent_version);pair(b,'Consent Status',x.consent_status,x.consent_status==='APPROVED_FOR_PRODUCTION'?'':'hold');pair(b,'TrustedForm Retained',x.trustedform_retained===true?'Yes':'No',x.trustedform_retained===true?'':'hold');pair(b,'Received',x.received_at);detail.replaceChildren(b)}catch(e){detail.replaceChildren(text('div',e.message,'danger'))}}async function load(){try{const r=await fetch('/api/mp/leads');if(r.status===401){location.assign('/login');return}const d=await r.json();list.replaceChildren();for(const x of d.leads){const b=document.createElement('button');b.className='lead';b.type='button';b.append(text('strong',(x.first_name||'')+' '+(x.last_name||'')));b.append(document.createElement('br'));b.append(text('span',(x.state||'—')+' · '+(x.intake_status||'—')+' · '+(x.contact_status||'—')));b.addEventListener('click',()=>one(x.submission_id));list.append(b)}if(!d.leads.length)list.append(text('div','No Mortgage Protection leads.'));const target=new URLSearchParams(location.search).get('lead');if(target)one(target)}catch(e){list.replaceChildren(text('div','Unable to load leads.','danger'))}}load();</script></body></html>
